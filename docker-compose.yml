version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: datapulse_db
    restart: always
    environment:
      POSTGRES_DB: datapulse_db
      POSTGRES_USER: datapulse_user
      POSTGRES_PASSWORD: datapulse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: datapulse_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-tu_clave_secreta_aqui
      - DATABASE_URL=postgres://datapulse_user:datapulse_password@db:5432/datapulse_db

volumes:
  postgres_data: