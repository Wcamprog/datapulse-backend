version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: datapulse_db
      POSTGRES_USER: datapulse_user
      POSTGRES_PASSWORD: datapulse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-<clave segura>
      - DATABASE_URL=DATABASE_URL

volumes:
  postgres_data: